version: v0.5

listeners:
  - name: inference
    address: 127.0.0.1
    port: 8899
    api_keys: ["${SR_CLIENT_KEY}"]
    apis:
      responses:
        models: [gpt-auto]
      messages:
        models: [claude-auto]

providers:
  models:
    - name: gpt-6.2-sol
      api_format: responses
      context_window_size: 500000
      max_output_tokens: 128000
      capabilities: [chat, reasoning, tools, vision, long_context, file_input, structured_json]
      reasoning:
        family: gpt-6-astra
      backend_refs:
        - name: codex-lb
          provider: openai
          allow_encrypted_reasoning_relay: true
          endpoint: "${CODEX_LB_BASE_URL}"
          api_key: "${CODEX_LB_API_KEY}"
    - name: gpt-6.2-astra
      api_format: responses
      context_window_size: 272000
      max_output_tokens: 128000
      capabilities: [chat, reasoning, tools, vision, long_context, file_input, structured_json]
      reasoning:
        family: gpt-6-astra
      backend_refs:
        - name: codex-lb
          provider: openai
          allow_encrypted_reasoning_relay: true
          endpoint: "${CODEX_LB_BASE_URL}"
          api_key: "${CODEX_LB_API_KEY}"
    - name: gpt-6-luna
      api_format: responses
      context_window_size: 272000
      max_output_tokens: 128000
      capabilities: [chat, reasoning, tools, vision, long_context, file_input, structured_json]
      reasoning:
        family: gpt-6-astra
      backend_refs:
        - name: codex-lb
          provider: openai
          allow_encrypted_reasoning_relay: true
          endpoint: "${CODEX_LB_BASE_URL}"
          api_key: "${CODEX_LB_API_KEY}"
    - name: claude-opus-5-5
      api_format: messages
      context_window_size: 1000000
      max_output_tokens: 128000
      capabilities: [chat, reasoning, tools, vision, long_context, file_input, structured_json]
      reasoning:
        family: claude-effort-adaptive
      backend_refs:
        - name: meridian
          provider: anthropic-compatible
          endpoint: "${MERIDIAN_BASE_URL}"
          api_key: "${MERIDIAN_API_KEY}"
          headers:
            x-meridian-agent: prime
    - name: claude-fable-5-2
      api_format: messages
      context_window_size: 1000000
      max_output_tokens: 128000
      capabilities: [chat, reasoning, tools, vision, long_context, file_input, structured_json]
      reasoning:
        family: claude-effort-always-on
      backend_refs:
        - name: meridian
          provider: anthropic-compatible
          endpoint: "${MERIDIAN_BASE_URL}"
          api_key: "${MERIDIAN_API_KEY}"
          headers:
            x-meridian-agent: prime

entrypoints:
  - model_names: [gpt-auto]
    recipe: gpt-auto
    default: true
  - model_names: [claude-auto]
    recipe: claude-auto

recipes:
  - name: gpt-auto
    candidate_requirements:
      capabilities: declared
      context: known_limits
    signals:
      systemone:
        - &difficulty
          name: difficulty
          deployment: liquid
          question:
            type: score
            instructions: How much reasoning does a strong expert need to answer this request well?
            levels:
              - Answer immediately, with no thinking
              - A little thought, one or two simple steps
              - Multi-step reasoning or a careful check
              - Deep expert reasoning on a hard problem
              - Research-level work on an open or frontier problem
          predicate:
            gte: 1.0
    decisions:
      - name: gpt-auto-hard
        priority: 3
        retention:
          drop: true
        rules:
          operator: AND
          on_unknown: no_match
          conditions:
            - type: systemone
              name: difficulty
              predicate:
                gte: 2.5
        modelRefs:
          - model: gpt-6.2-astra
            use_reasoning: true
            reasoning_effort: high
          - model: gpt-6.2-sol
            use_reasoning: true
            reasoning_effort: high
        algorithm:
          type: static
      - name: gpt-auto-easy
        priority: 2
        retention:
          drop: true
        rules:
          operator: AND
          on_unknown: no_match
          conditions:
            - type: systemone
              name: difficulty
              predicate:
                lt: 1.0
        modelRefs:
          - model: gpt-6-luna
            use_reasoning: true
            reasoning_effort: medium
          - model: gpt-6.2-sol
            use_reasoning: true
            reasoning_effort: high
        algorithm:
          type: static
      - name: gpt-auto-default
        priority: 1
        retention:
          drop: true
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: gpt-6.2-sol
            use_reasoning: true
            reasoning_effort: high
        algorithm:
          type: static
  - name: claude-auto
    candidate_requirements:
      capabilities: declared
      context: known_limits
    signals:
      systemone:
        - *difficulty
    decisions:
      - name: claude-auto-hard
        priority: 3
        retention:
          drop: true
        rules:
          operator: AND
          on_unknown: no_match
          conditions:
            - type: systemone
              name: difficulty
              predicate:
                gte: 2.5
        modelRefs:
          - model: claude-fable-5-2
            use_reasoning: true
            reasoning_effort: high
            reasoning_mode: adaptive
        algorithm:
          type: static
      - name: claude-auto-easy
        priority: 2
        retention:
          drop: true
        rules:
          operator: AND
          on_unknown: no_match
          conditions:
            - type: systemone
              name: difficulty
              predicate:
                lt: 1.0
        modelRefs:
          - model: claude-opus-5-5
            use_reasoning: true
            reasoning_effort: medium
            reasoning_mode: adaptive
        algorithm:
          type: static
      - name: claude-auto-default
        priority: 1
        retention:
          drop: true
        rules:
          operator: AND
          conditions: []
        modelRefs:
          - model: claude-opus-5-5
            use_reasoning: true
            reasoning_effort: high
            reasoning_mode: adaptive
        algorithm:
          type: static

global:
  model_catalog:
    deployments:
      liquid:
        provider: systemone
        endpoint: https://api.liquid.ai/decisions/v1/systemone
        model: d1.2-ultra
        schema: systemone/0.2
        auth:
          api_key_env: LIQUID_API_KEY
        timeout_ms: 3000
  router:
    # Prime's beads extension adds a <beads_context> block as a later user
    # message (after the task on a session's first turn). Score the task, not
    # the block; the request sent to the model is unchanged.
    routing_input:
      strip_blocks:
        - start: '<beads_context>'
          end: '</beads_context>'
    learning:
      enabled: false
      protection:
        enabled: false
  services:
    management_api:
      bind_address: 0.0.0.0
      port: 8080
      auth:
        mode: bearer
        tokens:
          - env: SR_MGMT_TOKEN
            role: admin
    observability:
      tracing:
        enabled: false
      profiling:
        enabled: false
    response_api:
      enabled: true
      store_backend: memory
      ttl_seconds: 86400
      max_responses: 1000
    router_replay:
      store_backend: memory
  plugins:
    - type: router_replay
      configuration:
        enabled: true
        prompt_capture: none
        capture_request_body: false
        capture_response_body: false
        capture_tool_results: false
